name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tap-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew test-bot --only-tap-syntax

  # Downloads each formula's release tarball and confirms the recorded sha256
  # matches, and that the URL is reachable. Replaces the old placeholder-only
  # guard, which passed on any non-all-zero hash — including checksums computed
  # against a 404 "Not Found" page. See scripts/verify-checksums.sh.
  checksum-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify formula URLs resolve and sha256 matches the real tarball
        run: bash scripts/verify-checksums.sh Formula

  # Static coherence guard: the pip install prefix must match the executable
  # each formula symlinks into `bin`. Catches `std_pip_args(prefix: true)` and
  # similar, where syntax + checksum CI pass but `brew install` fails at the
  # install_symlink step. See scripts/verify-formula-install.sh. No brew needed.
  install-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each formula installs where it symlinks
        run: bash scripts/verify-formula-install.sh Formula
