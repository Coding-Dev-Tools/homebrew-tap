name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Style gate must run against the CHECKED-OUT tree. `brew test-bot
  # --only-tap-syntax` (the previous implementation) re-taps the repo from its
  # DEFAULT branch, ignoring actions/checkout — so a red style error on main
  # deadlocks every PR branch (unfixable from any head). See council note
  # 2026-08-22T10:44Z in _cowork_ops/ALERT.md.
  tap-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Style-check the checked-out workspace
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v shfmt >/dev/null || brew install shfmt
          brew style "$GITHUB_WORKSPACE"
          shellcheck scripts/*.sh
          # Same flags Homebrew's own style check uses (-i 2 -ci); bare
          # `shfmt -d` defaults to tab indent and would false-fail the tap.
          shfmt -d -i 2 -ci scripts/*.sh

  # Downloads each formula's release tarball and confirms the recorded sha256
  # matches, and that the URL is reachable. Replaces the old placeholder-only
  # guard, which passed on any non-all-zero hash — including checksums computed
  # against a 404 "Not Found" page. See scripts/verify-checksums.sh.
  checksum-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Verify formula URLs resolve and sha256 matches the real tarball
        run: bash scripts/verify-checksums.sh Formula

  # Static coherence guard: the pip install prefix must match the executable
  # each formula symlinks into `bin`. Catches `std_pip_args(prefix: true)` and
  # similar, where syntax + checksum CI pass but `brew install` fails at the
  # install_symlink step. See scripts/verify-formula-install.sh. No brew needed.
  install-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Verify each formula installs where it symlinks
        run: bash scripts/verify-formula-install.sh Formula

  # Self-tests for the two silent-failure guards above. If a guard itself
  # regresses (e.g. starts accepting a broken formula), this job turns CI
  # RED instead of letting a broken formula ship under a green build.
  # No network / brew / ruby required. See scripts/test-guards.sh.
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Verify the formula guards actually catch broken formulae
        run: bash scripts/test-guards.sh

  # Supply-chain guard: every uses: directive must be SHA-pinned.
  # Catches regressions where a new workflow step uses a mutable tag (@v4)
  # instead of a full commit hash. See scripts/verify-sha-pins.sh.
  sha-pin-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Verify all GitHub Actions are SHA-pinned
        run: bash scripts/verify-sha-pins.sh
